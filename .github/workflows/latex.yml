name: Build MRI Physics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk biber texlive-latex-extra texlive-fonts-recommended texlive-science python3-numpy
      - name: Validate architecture
        run: |
          python3 scripts/check_structure.py
          python3 scripts/check_foundations.py
      - name: Compile book and check diagnostics
        run: |
          latexmk -pdf main.tex
          python3 scripts/check_build.py
      - name: Upload PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mri-physics-book
          path: |
            build/main.pdf
            build/main.log
            build/main.blg
          if-no-files-found: warn
